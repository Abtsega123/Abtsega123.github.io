name: Security portfolio CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API lab dependencies
        run: python -m pip install -r projects/secure-ticket-api/requirements.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Check compile errors
        run: python -m compileall -q projects
  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate site links and markup markers
        run: python tests/site_smoke.py
